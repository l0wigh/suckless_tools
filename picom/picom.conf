#################################
#           Animations          #
#################################

animations = (
    {
        triggers = [ "open", "show" ];
        opacity = {
            curve = "linear";
            duration = 0.4;
            start = 0;
            end = "window-raw-opacity";
        };
        blur-opacity = {
            curve = "linear";
            duration = 0.4;
            start = 0;
            end = 1;
        };
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.1, 0.9, 0.1, 1.1)";
            duration = 0.6;
            start = 0.5;
            end = 1;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) * window-width / 2";
        offset-y = "(1 - scale-y) * window-height / 2";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "close", "hide" ];
        opacity = {
            curve = "linear";
            duration = 0.3;
            start = "window-raw-opacity-before";
            end = 0;
        };
        blur-opacity = {
            curve = "linear";
            duration = 0.3;
            start = 1;
            end = 0;
        };
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.2, 0, 0.1, 1)";
            duration = 0.3;
            start = 1;
            end = 0.5;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) * window-width-before / 2";
        offset-y = "(1 - scale-y) * window-height-before / 2";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "geometry" ];
        scale-x = { curve = "cubic-bezier(0.1, 0.9, 0.1, 1.08)"; start = "window-width-before / window-width"; end = 1; duration = 0.6; };
        scale-y = { curve = "cubic-bezier(0.1, 0.9, 0.1, 1.08)"; start = "window-height-before / window-height"; end = 1; duration = 0.6; };
        offset-x = { curve = "cubic-bezier(0.1, 0.9, 0.1, 1.08)"; start = "window-x-before - window-x"; end = 0; duration = 0.6; };
        offset-y = { curve = "cubic-bezier(0.1, 0.9, 0.1, 1.08)"; start = "window-y-before - window-y"; end = 0; duration = 0.6; };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    }
)

#################################
#             Rules             #
#################################

rules = (
  {
    match = "window_type = 'normal' || window_type = 'dialog'";
    fade = true;
    shadow = true;
    blur-background = true;
    corner-radius = 6;
  },
  {
    match = "class_g = 'Polybar'";
    shadow-offset-x = -100;
    corner-radius = 6;
  },
  {
    match = "class_g = 'dwm' || name = 'xflash' || name = 'no_rounding'";
    shadow = false;
    corner-radius = 0;
  },
  {
    match = "class_g = 'St' || class_g = 'Alacritty' || class_g = 'discord' || class_g = 'dev.zed.Zed'";
    opacity = 0.85;
  },
  {
    match = "class_g = 'firefox' || class_g = 'Polybar'";
    opacity = 1.0;
  },
  {
    match = "name = 'polybar_dock'";
    corner-radius = 16;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    blur-background = false;
    shadow = false;
	opacity = 1;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
    opacity = 1;
  },
)

#################################
#      Global Configuration     #
#################################

backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

blur: {
  method = "dual_kawase";
  strength = 8;
  background = true;
};

shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.82;
crop-shadow-to-monitor = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
xrender-sync-fence = true;
log-level = "warn";
